<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINIMAL — Essential Living</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fcfcfc;
            --bg-secondary: #f4f4f4;
            --text-main: #111111;
            --text-muted: #767676;
            --border-color: #e5e5e5;
            --accent: #000000;
            --radius: 4px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            background: rgba(252, 252, 252, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .nav-links li {
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-links li:hover, .nav-links li.active {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-main);
        }

        .badge {
            background: var(--text-main);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .hero {
            margin-bottom: 3rem;
            padding: 3rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Controls / Filters */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-bar {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            font-size: 0.85rem;
            background: transparent;
        }

        .filter-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: transparent;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2.5rem 1.5rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            position: relative;
            transition: var(--transition);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/5;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 0.8rem;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .img-wrapper img {
            transform: scale(1.03);
        }

        .wishlist-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: var(--transition);
        }

        .wishlist-btn.active {
            color: red;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .product-price {
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 0.3rem;
        }

        .add-to-cart-btn {
            margin-top: 0.8rem;
            padding: 0.6rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.9;
        }

        .add-to-cart-btn:hover {
            opacity: 1;
        }

        /* Cart Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 200;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--bg-primary);
            box-shadow: -4px 0 24px rgba(0,0,0,0.05);
            z-index: 201;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .drawer.active {
            transform: translateX(-420px);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .cart-item img {
            width: 60px;
            height: 75px;
            object-fit: cover;
            border-radius: var(--radius);
            background: var(--bg-secondary);
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }

        .qty-btn {
            background: var(--bg-secondary);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .drawer-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        /* Modal Quick View */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-primary);
            width: 90%;
            max-width: 800px;
            border-radius: var(--radius);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .modal-img {
            width: 50%;
            background: var(--bg-secondary);
        }

        .modal-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-body {
            width: 50%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-img, .modal-body { width: 100%; }
            .modal-img { height: 250px; }
            .hero h1 { font-size: 1.8rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-bar { max-width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="filterCategory('all')">Essence</div>
        <ul class="nav-links">
            <li class="active" onclick="filterCategory('all', this)">All</li>
            <li onclick="filterCategory('apparel', this)">Apparel</li>
            <li onclick="filterCategory('home', this)">Home</li>
            <li onclick="filterCategory('objects', this)">Objects</li>
        </ul>
        <div class="nav-actions">
            <button class="icon-btn" onclick="openDrawer('wishlist')">
                Wishlist (<span id="wishlist-count">0</span>)
            </button>
            <button class="icon-btn" onclick="openDrawer('cart')">
                Cart <span class="badge" id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <h1>Simplicity in Design & Living</h1>
            <p>Thoughtfully crafted goods for your everyday ritual.</p>
        </section>

        <section class="controls">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search items..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <select id="price-filter" onchange="applyFilters()">
                    <option value="all">All Prices</option>
                    <option value="under-50">Under $50</option>
                    <option value="50-150">$50 - $150</option>
                    <option value="over-150">Over $150</option>
                </select>
                <select id="sort-filter" onchange="applyFilters()">
                    <option value="default">Sort By</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </section>

        <section class="product-grid" id="product-grid">
            <!-- Dynamic Products Injected Here -->
        </section>
    </div>

    <!-- Drawer (Cart & Wishlist) -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Cart</h3>
            <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        </div>
        <div class="cart-items" id="drawer-items">
            <!-- Dynamic Drawer Items -->
        </div>
        <div class="drawer-footer" id="drawer-footer">
            <div style="display: flex; justify-content: space-between; font-weight: 500;">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="handleCheckout()">Checkout</button>
        </div>
    </aside>

    <!-- Modal (Quick View) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-img">
                <img id="modal-img" src="" alt="">
            </div>
            <div class="modal-body">
                <span id="modal-category" class="product-category"></span>
                <h2 id="modal-title" style="margin: 0.5rem 0;"></h2>
                <p id="modal-price" class="product-price" style="font-size: 1.1rem; font-weight: 500;"></p>
                <p id="modal-desc" style="color: var(--text-muted); font-size: 0.85rem; margin: 1rem 0;"></p>
                <button id="modal-add-btn" class="add-to-cart-btn" style="padding: 0.8rem;">Add to Cart</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, title: 'Ceramic Tea Set', category: 'home', price: 85, img: 'https://images.unsplash.com/photo-1576020688413-eac15d1221fa?auto=format&fit=crop&q=80&w=600', desc: 'Handcrafted minimalist ceramic tea set including a pot and two cups.' },
            { id: 2, title: 'Linen Lounge Shirt', category: 'apparel', price: 110, img: 'https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&q=80&w=600', desc: '100% organic linen shirt designed for relaxed everyday wear.' },
            { id: 3, title: 'Oak Desk Organizer', category: 'objects', price: 45, img: 'https://images.unsplash.com/photo-1584589167171-541ce45f1eea?auto=format&fit=crop&q=80&w=600', desc: 'Solid oak wood tray designed to keep modern workspaces clutter-free.' },
            { id: 4, title: 'Monochrome Wall Clock', category: 'home', price: 65, img: 'https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?auto=format&fit=crop&q=80&w=600', desc: 'Silent quartz movement wall clock with minimalist face design.' },
            { id: 5, title: 'Cotton Everyday Tote', category: 'apparel', price: 35, img: 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&q=80&w=600', desc: 'Heavyweight canvas tote bag with reinforced handles.' },
            { id: 6, title: 'Matte Glass Vase', category: 'objects', price: 55, img: 'https://images.unsplash.com/photo-1612196808214-b7e239e5f6b7?auto=format&fit=crop&q=80&w=600', desc: 'Hand-blown frosted glass vase with clean architectural lines.' }
        ];

        let state = {
            cart: [],
            wishlist: [],
            activeCategory: 'all',
            drawerMode: 'cart' // 'cart' or 'wishlist'
        };

        // Render Products
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 0;">No products match your criteria.</p>`;
                return;
            }

            items.forEach(product => {
                const isWishlisted = state.wishlist.includes(product.id);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${product.img}" alt="${product.title}" onclick="openModal(${product.id})">
                        <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="toggleWishlist(${product.id})">
                            ${isWishlisted ? '♥' : '♡'}
                        </button>
                    </div>
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <div class="product-title" onclick="openModal(${product.id})">${product.title}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        // Filtering & Sorting
        function filterCategory(cat, el) {
            state.activeCategory = cat;
            if (el) {
                document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
                el.classList.add('active');
            }
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const priceFilter = document.getElementById('price-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;

            let filtered = products.filter(p => {
                const matchesCat = state.activeCategory === 'all' || p.category === state.activeCategory;
                const matchesSearch = p.title.toLowerCase().includes(query);
                let matchesPrice = true;

                if (priceFilter === 'under-50') matchesPrice = p.price < 50;
                else if (priceFilter === '50-150') matchesPrice = p.price >= 50 && p.price <= 150;
                else if (priceFilter === 'over-150') matchesPrice = p.price > 150;

                return matchesCat && matchesSearch && matchesPrice;
            });

            if (sortFilter === 'low-high') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortFilter === 'high-low') {
                filtered.sort((a, b) => b.price - a.price);
            }

            renderProducts(filtered);
        }

        // Cart Actions
        function addToCart(productId) {
            const item = state.cart.find(i => i.id === productId);
            if (item) {
                item.qty++;
            } else {
                state.cart.push({ id: productId, qty: 1 });
            }
            updateCartUI();
            openDrawer('cart');
        }

        function updateQty(productId, delta) {
            const item = state.cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                state.cart = state.cart.filter(i => i.id !== productId);
            }
            updateCartUI();
            renderDrawerItems();
        }

        function updateCartUI() {
            const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        // Wishlist Actions
        function toggleWishlist(productId) {
            const index = state.wishlist.indexOf(productId);
            if (index > -1) {
                state.wishlist.splice(index, 1);
            } else {
                state.wishlist.push(productId);
            }
            document.getElementById('wishlist-count').innerText = state.wishlist.length;
            applyFilters();
            if (state.drawerMode === 'wishlist') renderDrawerItems();
        }

        // Drawer Management
        function openDrawer(mode) {
            state.drawerMode = mode;
            document.getElementById('drawer-title').innerText = mode === 'cart' ? 'Shopping Cart' : 'Wishlist';
            document.getElementById('drawer-footer').style.display = mode === 'cart' ? 'block' : 'none';
            renderDrawerItems();
            document.getElementById('drawer').classList.add('active');
            document.getElementById('drawer-overlay').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('drawer-overlay').classList.remove('active');
        }

        function renderDrawerItems() {
            const container = document.getElementById('drawer-items');
            container.innerHTML = '';

            if (state.drawerMode === 'cart') {
                if (state.cart.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>';
                    document.getElementById('cart-subtotal').innerText = '$0.00';
                    return;
                }

                let subtotal = 0;
                state.cart.forEach(cartItem => {
                    const product = products.find(p => p.id === cartItem.id);
                    subtotal += product.price * cartItem.qty;

                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <img src="${product.img}" alt="${product.title}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${product.title}</div>
                            <div class="cart-item-price">$${product.price.toFixed(2)}</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(${product.id}, -1)">-</button>
                                <span style="font-size: 0.8rem;">${cartItem.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${product.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(itemEl);
                });
                document.getElementById('cart-subtotal').innerText = `$${subtotal.toFixed(2)}`;

            } else {
                if (state.wishlist.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your wishlist is empty.</p>';
                    return;
                }

                state.wishlist.forEach(id => {
                    const product = products.find(p => p.id === id);
                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <img src="${product.img}" alt="${product.title}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${product.title}</div>
                            <div class="cart-item-price">$${product.price.toFixed(2)}</div>
                            <button class="add-to-cart-btn" style="padding: 0.3rem 0.6rem; margin-top: 0.4rem;" onclick="addToCart(${product.id})">Move to Cart</button>
                        </div>
                        <button style="background:none; border:none; cursor:pointer;" onclick="toggleWishlist(${product.id})">&times;</button>
                    `;
                    container.appendChild(itemEl);
                });
            }
        }

        // Quick View Modal
        function openModal(productId) {
            const product = products.find(p => p.id === productId);
            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-category').innerText = product.category;
            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-price').innerText = `$${product.price.toFixed(2)}`;
            document.getElementById('modal-desc').innerText = product.desc;
            
            const addBtn = document.getElementById('modal-add-btn');
            addBtn.onclick = () => {
                addToCart(product.id);
                closeModal();
            };

            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function handleCheckout() {
            if (state.cart.length === 0) return;
            alert('Thank you for your order! Detailed checkout flow process initialized.');
            state.cart = [];
            updateCartUI();
            closeDrawer();
        }

        // Initialize App
        renderProducts(products);
    </script>
</body>
</html>
